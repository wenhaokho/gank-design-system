<!-- @dsCard group="Data" height=260 subtitle="summary row and a wallet balance" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Stat — preview</title></head>
<body>
<div class="gk-col" style="max-width:760px">
  <div class="gk-panel" style="padding:var(--space-4) var(--space-5)">
    <div class="gk-help" style="margin-bottom:var(--space-3)">Ringkasan bulanan</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr)">
      <div class="gk-stat"><span class="gk-stat-icon" style="background:#1f4d3a"></span><b>0.00</b><span>USD Pendapatan</span></div>
      <div class="gk-stat" style="border-left:1px solid var(--line);padding-left:var(--space-4)"><span class="gk-stat-icon" style="background:#4a2a5e"></span><b>0</b><span>Pendukung</span></div>
      <div class="gk-stat" style="border-left:1px solid var(--line);padding-left:var(--space-4)"><span class="gk-stat-icon" style="background:#2a3a5e"></span><b>1</b><span>Tayangan</span></div>
    </div>
  </div>
  <div class="gk-panel" style="max-width:380px;padding:var(--space-4)">
    <div class="gk-help" style="margin-bottom:var(--space-2)">Gold</div>
    <div class="gk-balance">108 <span class="gk-gold">●</span></div>
    <div class="gk-row" style="padding:var(--space-3) 0 0"><button class="gk-btn gk-btn-sm" style="flex:1;justify-content:center">Tambah gold</button><button class="gk-btn gk-btn-sm" style="flex:1;justify-content:center">Redeem kode voucher</button></div>
  </div>
</div>
</body></html>
