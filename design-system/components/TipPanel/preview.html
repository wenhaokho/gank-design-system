<!-- @dsCard group="Public profile" height=330 subtitle="profile theme" -->
<!doctype html>
<html data-theme="profile"><head><meta charset="utf-8"><title>TipPanel — preview</title></head>
<body>
<div class="gk-col" style="max-width:420px">
  <div class="gk-tip">
    <h3>Dukung Saya</h3>
    <div style="display:flex"><select class="gk-select" aria-label="Mata uang" style="width:110px;border-radius:var(--radius-md) 0 0 var(--radius-md)"><option>IDR</option><option>USD</option></select><input class="gk-input" placeholder="Masukkan harga" aria-label="Jumlah" style="border-radius:0 var(--radius-md) var(--radius-md) 0;border-left:1px solid var(--line)"></div>
    <div class="gk-tip-amounts"><button>Rp 20.000</button><button>Rp 100.000</button><button>Rp 200.000</button></div>
    <button class="gk-btn gk-btn-cta gk-btn-block">Tip</button>
    <div class="gk-tip-note">Semua tip diberikan langsung ke kreator dan tidak dapat dikembalikan.</div>
  </div>
</div>
</body></html>
